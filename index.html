<!doctype html>
<html lang="en">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11151c">
<title>Week Planner</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1b1f27; --muted:#5d6675; --line:#e2e5ea; --accent:#0e8a7e;
  --study:#2f6fde; --class:#7a52c7; --sport:#d9572b; --meal:#3f9b4a; --rest:#8a94a6; --work:#b8860b; --fixed:#c2185b; --flex:#0e8a7e;
  --now:#fff6d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11151c; --card:#1a2029; --ink:#e7eaf0; --muted:#9aa4b5; --line:#2a313d; --accent:#2fc4b2;
    --study:#6f9cff; --class:#b08cff; --sport:#ff8a5c; --meal:#6fcf7a; --rest:#8a94a6; --work:#e2b33c; --fixed:#ff5c93; --flex:#2fc4b2; --now:#2c2a1c; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.top h1{font-size:18px;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:15px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:3px 8px;font-size:13px}
main{padding:12px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{margin:0;font-size:20px;text-align:center;flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.nowbox{background:var(--now)}
.nowbox b{font-size:17px}
.dl-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.dl-chip{flex:0 0 auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--card);font-size:13px}
.dl-chip b{display:block;font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.block{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.time{flex:0 0 92px;font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);padding-top:1px}
.stripe{flex:0 0 4px;border-radius:2px}
.body{flex:1;min-width:0}
.body .t{font-weight:600}
.body .d{font-size:14px;color:var(--muted);margin-top:2px;white-space:pre-line}
.body .tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
.block.done .t{text-decoration:line-through;opacity:.6}
.block.cur{background:var(--now);margin:0 -14px;padding-left:14px;padding-right:14px}
.block.squeezed .t{opacity:.55}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.k-study,.k-light{background:var(--study)} .k-class{background:var(--class)} .k-gym,.k-cardio,.k-bjj,.k-surf{background:var(--sport)}
.k-meal{background:var(--meal)} .k-rest,.k-travel,.k-free,.k-wake,.k-break{background:var(--rest)} .k-work{background:var(--work)}
.k-event,.k-due{background:var(--fixed)} .k-flex{background:var(--flex)} .k-bed,.k-gf{background:#6b5bd6} .k-typing{background:#4a90a4}
.due-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--line);color:var(--ink)}
.pill.red{background:var(--fixed);color:#fff}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;font-size:12px;min-width:0}
.wday h3{margin:0 0 4px;font-size:13px}
.wday.today{outline:2px solid var(--accent)}
.wb{display:flex;gap:4px;margin:2px 0}
.wb .s{flex:0 0 3px;border-radius:2px}
.wb .x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){ .week{grid-template-columns:1fr} .wb .x{white-space:normal} .time{flex-basis:78px;font-size:13px} }
form.inline{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:end}
form.inline label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
form.inline input,form.inline select,textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
form.inline .full{grid-column:1/-1}
.carry li{margin:4px 0}
h3.sec{font-size:16px;margin:4px 0 6px}
ul.rules{padding-left:18px;margin:6px 0} ul.rules li{margin:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:5px 10px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.hide{display:none}
</style>
</head>

<header>
  <div class="wrap">
    <div class="top"><h1>Week Planner</h1><span class="muted small" id="clock"></span></div>
    <nav class="tabs" id="tabs">
      <button data-v="today" class="on">Day</button>
      <button data-v="week">Week</button>
      <button data-v="deadlines">Deadlines</button>
      <button data-v="rules">How it works</button>
      <button data-v="sync">Sync</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

/* ---------- time helpers ---------- */
const m = s => { const [h, mi] = s.split(":").map(Number); return h * 60 + mi; };
const hm = n => { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0"); };
const keyOf = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseKey = k => { const [y, mo, d] = k.split("-").map(Number); return new Date(y, mo - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const mondayOf = k => { const d = parseKey(k); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return keyOf(d); };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtDay = k => { const d = parseKey(k); return DAYS[d.getDay()] + " " + d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" }); };

/* ---------- build a day ---------- */
function defaultTask(kind) {
  if (kind === "light") return T("PM MCQ: 20-question practice", "D:\\ProjMgmt_MCQ\\quiz.html, the topic the Progress tab suggests.");
  return T("Next task for the nearest deadline", "Catch-up list first, then the Deadlines tab.");
}
function buildDay(k) {
  const dow = parseKey(k).getDay();
  const week = mondayOf(k);
  const surfDay = S.surf[week] || "fri";
  const ds = S.days[k] || { events: [], late: [], skip: [], done: [] };
  let blocks = TEMPLATE[dow].map(([s, e, kind, title, slot]) => ({ id: s + "-" + kind, s: m(s), e: m(e), kind, title, slot }));

  blocks.forEach(b => {
    if (b.kind === "surfopt") {
      if (b.slot === surfDay) { b.kind = "surf"; b.title = "Surf (your surf slot this week)"; }
      else { b.kind = "study"; b.title = "Deep work (not your surf slot this week)"; b.task = SWAP[week] || defaultTask("study"); }
    }
    if (TASKED.has(b.kind) && !b.task) b.task = (PLAN[k] && PLAN[k][b.slot]) || defaultTask(b.kind);
  });

  const fixedEv = (EVENTS[k] || []).map(([s, e, kind, title], i) => ({ id: "plan" + i, s: m(s), e: m(e), kind, title }));
  const userEv = ds.events.map((x, i) => ({ id: "user" + i, s: m(x.s), e: m(x.e), kind: "event", title: x.title, user: i }));
  // a planned exam in a class slot replaces that class
  fixedEv.forEach(f => { blocks = blocks.filter(b => !(b.kind === "class" && b.s === f.s)); });
  blocks = blocks.filter(b => !ds.skip.includes(b.id));

  // ran late: extend that block, shift later flexible blocks, flex absorbs first
  ds.late.forEach(L => {
    const target = blocks.find(b => b.id === L.id);
    if (!target) return;
    target.e += L.min; target.late = (target.late || 0) + L.min;
    let push = L.min;
    blocks.filter(b => b.s > target.s && !FIXED.has(b.kind)).sort((a, b) => a.s - b.s).forEach(b => {
      if (push <= 0) return;
      if (b.kind === "flex") {
        const ns = b.s + push;
        if (ns < b.e) { b.s = ns; push = 0; } else { push = ns - b.e; b.s = b.e; b.gone = true; }
      } else { b.s += push; b.e += push; }
    });
  });

  // fixed things win: trim flexible blocks around them
  const hard = blocks.filter(b => FIXED.has(b.kind) && b.e > b.s).concat(fixedEv, userEv).filter(b => b.e > b.s);
  blocks.forEach(b => {
    if (FIXED.has(b.kind) || b.gone) return;
    hard.forEach(h => {
      if (h === b) return;
      if (h.s <= b.s && h.e > b.s) b.s = Math.min(h.e, b.e);
      else if (h.s > b.s && h.s < b.e) b.e = h.s;
    });
    if (TASKED.has(b.kind)) { if (b.e - b.s < 15) b.squeezed = true; }
    else if (b.e <= b.s && b.kind !== "bed") b.gone = true;
  });

  let all = blocks.filter(b => !b.gone).concat(fixedEv, userEv);
  all.sort((a, b) => a.s - b.s || (a.e - a.s) - (b.e - b.s));
  all.forEach(b => { b.done = ds.done.includes(b.id); });
  return all;
}

function renderWeek() {
  const mon = mondayOf(cur);
  const today = keyOf(new Date());

  h += `<div class="small muted" style="margin:4px 0 8px">Tap a day to open it. Showing study, sport, class and fixed events.</div><div class="week">`;
  for (let i = 0; i < 7; i++) {

    const bl = buildDay(k).filter(b => !["wake", "break", "travel", "free", "meal", "typing"].includes(b.kind) && !(b.kind === "bed" && b.e === b.s));

  else if (a === "next") cur = addDays(cur, 1);
  else if (a === "gotoday") cur = keyOf(new Date());
  else if (a === "pweek") cur = addDays(cur, -7);
  else if (a === "nweek") cur = addDays(cur, 7);
  else if (a === "open") { cur = el.dataset.k; view = "today"; }
  else if (a === "addev") openForm = openForm === "ev" ? null : "ev";
  else if (a === "cancel") openForm = null;
  else if (a === "surf") { S.surf[mondayOf(cur)] = el.dataset.v; save(); }
  else if (a === "reset") { if (confirm("Clear every change you made to " + fmtDay(cur) + "?")) { delete S.days[cur]; save(); } }
  else if (a === "done") { const d = ds(); d.done = d.done.includes(id) ? d.done.filter(x => x !== id) : d.done.concat(id); save(); }
  else if (a === "late") openForm = openForm === "late:" + id ? null : "late:" + id;
  else if (a === "lateby") { ds().late.push({ id, min: +el.dataset.n }); openForm = null; save(); }
  else if (a === "skip" || a === "tocarry") {
    const b = findBlock();
    if (b && b.task) S.carry.push({ id: Date.now().toString(36), t: b.task.t, d: b.task.d, from: cur, done: false });
    if (a === "skip") ds().skip.push(id); else ds().done.push(id);
    save();
  }
  else if (a === "delev") { ds().events.splice(+el.dataset.i, 1); save(); }
  else if (a === "cdone" || a === "cdrop") { const c = S.carry.find(x => x.id === id); if (c) { if (a === "cdone") c.done = true; else S.carry = S.carry.filter(x => x !== c); } save(); }
  else if (a === "deldl") { S.extraDl.splice(+el.dataset.i, 1); save(); }
  else if (a === "copy") { const t = document.getElementById("code"); t.select(); try { navigator.clipboard.writeText(t.value); } catch (x) { document.execCommand("copy"); } el.textContent = "Copied"; return; }
  else if (a === "load") {
    try { const v = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("paste").value.trim())))); S = Object.assign({ days: {}, carry: [], surf: {}, extraDl: [] }, v); save(); alert("Loaded."); }
    catch (x) { alert("That code didn't work. Copy it again from the other device."); return; }
  }
  render();
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "evf") {
    const s = f.get("s"), en = f.get("e");
    if (m(en) <= m(s)) { alert("The end time needs to be after the start."); return; }
    dayState(cur).events.push({ title: f.get("title"), s, e: en }); openForm = null;
  } else if (e.target.id === "dlf") {
    S.extraDl.push({ d: f.get("d"), t: f.get("t") || "", what: f.get("what"), where: "", tbc: false });
  }
  save(); render();
});
render();
setInterval(() => { if (view === "today" && !openForm) render(); }, 60000);
</script>
