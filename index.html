<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f15">
<title>Week Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#151a22; --muted:#5b6575; --line:#e1e5eb; --soft:#eef1f5;
  --accent:#0a8f84; --accent-ink:#ffffff; --glow:rgba(10,143,132,.18);
  --study:#2f6fde; --class:#7a52c7; --sport:#e0602f; --meal:#3f9b4a; --rest:#8b95a7; --work:#b8860b; --fixed:#d81b60; --flex:#0a8f84; --bedc:#6b5bd6; --typing:#2b8fb0;
  --now:#fff7dc; --amber:#c77800; --red:#d81b60;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b0f15; --card:#141a23; --ink:#e9edf3; --muted:#9aa5b6; --line:#232b37; --soft:#1a212c;
    --accent:#22d3c0; --accent-ink:#04211e; --glow:rgba(34,211,192,.22);
    --study:#6f9cff; --class:#b590ff; --sport:#ff8a5c; --meal:#6fd27b; --rest:#7f8a9c; --work:#e9b949; --fixed:#ff5c93; --flex:#22d3c0; --bedc:#9c8cff; --typing:#5cc7e8;
    --now:#1d2a2a; --amber:#f0a73a; --red:#ff5c93; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--glow)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.top h1{font-size:19px;margin:0;letter-spacing:.02em}
.top h1 span{color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.top-r{display:flex;align-items:center;gap:10px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0}
.iconbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;min-height:36px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.frow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.frow:first-child{border-top:0}
.frow .tm{flex:0 0 66px;font-variant-numeric:tabular-nums;font-weight:600}
.frow .x{flex:1;min-width:0}
.frow .x b{font-weight:600}
.fday{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:12px 0 2px}
.fday:first-child{margin-top:0}
.big-n{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tgrid{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.trow{display:contents;cursor:pointer}
.trow>div{padding:9px 0;border-top:1px solid var(--line)}
.trow:first-child>div{border-top:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 11px;font-size:14px}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{min-height:44px;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px}
.btn.ghost{background:transparent}
main{padding:10px 0 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin:10px 0}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h2{margin:0;font-size:20px;text-align:center;flex:1}
.daynav .btn{min-width:44px;font-size:20px;line-height:1}
.muted{color:var(--muted)}
.small{font-size:14px}
h3.sec{font-size:16px;margin:0 0 8px;letter-spacing:.01em}
.nowcard{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.nowcard .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.nowcard .big{font-size:21px;font-weight:700;line-height:1.25;margin:3px 0}
.nowcard .next{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:15px}
.bar{height:7px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.dl-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.dl-strip::-webkit-scrollbar{display:none}
.dl-chip{flex:0 0 auto;border:1px solid var(--line);border-left:4px solid var(--rest);border-radius:10px;padding:6px 10px;background:var(--card);font-size:13px;max-width:220px}
.dl-chip b{display:block;font-size:15px}
.dl-chip.amber{border-left-color:var(--amber)} .dl-chip.red{border-left-color:var(--red)}
.pack{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pack span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:14px}
.block{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.block:first-child{border-top:0}
.time{flex:0 0 70px;font-variant-numeric:tabular-nums;padding-top:1px;line-height:1.2}
.time b{display:block;font-size:16px;font-weight:600}
.time span{font-size:13px;color:var(--muted)}
.time small,.ap{font-size:.72em;font-weight:500;margin-left:1px;color:var(--muted)}
.stripe{flex:0 0 4px;border-radius:2px}
.body{flex:1;min-width:0}
.body .t{font-weight:600;font-size:17px;line-height:1.3}
.body .d{font-size:14px;color:var(--muted);margin-top:3px;white-space:pre-line;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px;font-weight:600}
.block.done .t{text-decoration:line-through;opacity:.55}
.block.done .d{opacity:.6}
.block.cur{background:var(--now);margin:0 -15px;padding-left:15px;padding-right:15px;box-shadow:inset 3px 0 0 var(--accent)}
.block.squeezed .t{opacity:.55}
.block.fixed .t::after{content:"fixed";display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:7px;vertical-align:2px;font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.past-toggle{width:100%;text-align:left;background:transparent;border:0;color:var(--accent);padding:4px 0 10px;font-size:15px;font-weight:600}
.k-study,.k-light{background:var(--study)} .k-class{background:var(--class)} .k-gym,.k-cardio,.k-bjj,.k-surf{background:var(--sport)}
.k-meal{background:var(--meal)} .k-rest,.k-travel,.k-free,.k-wake,.k-break{background:var(--rest)} .k-work,.k-errand{background:var(--work)}
.k-event,.k-due{background:var(--fixed)} .k-flex{background:var(--flex)} .k-bed,.k-gf{background:var(--bedc)} .k-typing{background:var(--typing)}
.due-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.due-row:first-child{border-top:0}
.due-row .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:1px 8px;background:var(--soft);border:1px solid var(--line);color:var(--ink)}
.pill.red{background:#c2185b;border-color:#c2185b;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--soft);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;font-size:13px;min-width:0;cursor:pointer}
.wday h3{margin:0 0 5px;font-size:14px;display:flex;justify-content:space-between}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--glow)}
.wb{display:flex;gap:6px;margin:3px 0;align-items:baseline}
.wb .s{flex:0 0 3px;align-self:stretch;border-radius:2px}
.wb .tm{flex:0 0 52px;color:var(--muted);font-variant-numeric:tabular-nums}
.wb .x{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:760px){ .week{grid-template-columns:1fr} .wb .x{white-space:normal} .stats{grid-template-columns:repeat(2,1fr)} }
form.inline{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:end}
form.inline label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:3px}
input,select,textarea{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
form.inline .full{grid-column:1/-1}
.carry li{margin:6px 0}
ul.rules{padding-left:18px;margin:6px 0} ul.rules li{margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{min-height:44px;border:0;background:var(--soft);color:var(--ink);padding:6px 11px;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.hide{display:none}
a{color:var(--accent);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;box-shadow:0 6px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);font-size:15px}
#toast .btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.check{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-height:44px;cursor:pointer}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--accent);margin:0}
.check.on span{text-decoration:line-through;color:var(--muted)}
.check small{color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.shop-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700;margin:14px 0 2px}
table.meals{width:100%;border-collapse:collapse;font-size:14px}
table.meals td,table.meals th{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
table.meals th{color:var(--muted);font-weight:600}
</style>
</head>

<header>
  <div class="wrap">
    <div class="top"><h1>Week <span>Planner</span></h1><span class="top-r"><span class="clock" id="clock"></span><button class="iconbtn" id="findbtn" aria-label="Search the plan"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg></button></span></div>
    <nav class="tabs" id="tabs">
      <button data-v="today" class="on">Day</button>
      <button data-v="week">Week</button>
      <button data-v="deadlines">Due</button>
      <button data-v="shop">Shop</button>
      <button data-v="rules">Help</button>
      <button data-v="sync">Sync</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

/* ---------- time helpers ---------- */
const m = s => { const [h, mi] = s.split(":").map(Number); return h * 60 + mi; };
const hm = n => { n = ((n % 1440) + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0"); };
const keyOf = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseKey = k => { const [y, mo, d] = k.split("-").map(Number); return new Date(y, mo - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const mondayOf = k => { const d = parseKey(k); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return keyOf(d); };

const fmtDay = k => { const d = parseKey(k); return DAYS[d.getDay()] + " " + d.getDate() + " " + d.toLocaleString("en-GB", { month: "short" }); };

/* ---------- training layer: each week's runs and swims, fitted into the routine ---------- */
// where each day's session sits, and how long it can get before it would cost study time:
// Monday absorbs the 5:15pm flex (45 min) plus a 7:00am start once the long run passes 80 min,
// Tuesday and Thursday each absorb that evening's flex, Friday only has a 20 min gap before the shift,
// Saturday's run comes out of the start of the evening off.
const TRAIN_SLOTS = {
  1: { key: "mon", id: "07:40-cardio", max: 110, early: { over: 80, wake: "07:30-wake", by: 30 } },
  2: { key: "tue", id: "13:50-cardio", max: 70 },
  4: { key: "thu", after: "11:10-gym", max: 50 },
  5: { key: "fri", id: "07:40-cardio", max: 55 },
  6: { key: "sat", at: "17:00-free", max: 90, shower: 10 },
  0: { key: "sun", id: "09:05-gym", note: true }, // legs stays; the note says how hard, given Monday's long run
};
const trainWeeks = () => Object.keys(TRAIN).sort();
function trainLabel(week) {
  const i = trainWeeks().indexOf(week);
  return i < 0 ? "" : `Week ${i + 1} of ${trainWeeks().length} · ${TRAIN[week].phase}`;
}
function applyTraining(k, dow, blocks, ripple) {
  const week = mondayOf(k), wk = TRAIN[week], slot = TRAIN_SLOTS[dow];
  if (!wk || !slot || !(slot.key in wk)) return;
  const ses = wk[slot.key];
  const fill = (b, [min, title, detail]) => {
    b.title = title; b.detail = trainLabel(week) + (detail ? ". " + detail : ""); b.e = b.s + Math.min(min, slot.max); b.train = true;
  };
  if (slot.note) {
    const b = blocks.find(x => x.id === slot.id);
    if (b && ses) b.detail = trainLabel(week) + ". " + ses;
    return;
  }
  if (slot.id) {
    const b = blocks.find(x => x.id === slot.id);
    if (!b) return; // a one-off reshape already rewrote this day
    if (!ses) { b.gone = true; return; }
    const oldEnd = b.e;
    if (slot.early && ses[0] > slot.early.over) {
      const w = blocks.find(x => x.id === slot.early.wake);
      if (w) { w.s -= slot.early.by; w.e -= slot.early.by; }
      b.s -= slot.early.by;
    }
    fill(b, ses);
    if (b.e > oldEnd) ripple(b);
    return;
  }
  if (!ses) return;
  if (slot.after) {
    const g = blocks.find(x => x.id === slot.after);
    if (!g) return;
    const b = { id: hm(g.e) + "-cardio-t", s: g.e, e: g.e, kind: "cardio" };
    fill(b, ses);
    blocks.push(b);
    ripple(b);
    return;
  }
  const f = blocks.find(x => x.id === slot.at);
  if (!f) return;
  const b = { id: hm(f.s) + "-cardio-t", s: f.s, e: f.s, kind: "cardio" };
  fill(b, ses);
  const sh = { id: hm(b.e) + "-break-t", s: b.e, e: b.e + slot.shower, kind: "break", title: "Shower" };
  f.s = sh.e;
  blocks.push(b, sh);
}

function buildDay(k) {
  const dow = parseKey(k).getDay();
  const week = mondayOf(k);
  const surfDay = S.surf[week] || "fri";
  const ds = S.days[k] || { events: [], late: [], skip: [], done: [] };
  let blocks = TEMPLATE[dow].map(([s, e, kind, title, slot]) => ({ id: s + "-" + kind, s: m(s), e: m(e), kind, title, slot }));
  // one-off changes to the routine on this date: [start, end, kind, short title, slot, details]
  const rs = RESHAPE[k];
  if (rs) {
    blocks = blocks.filter(b => !rs.drop.includes(b.id));
    rs.add.forEach(([s, e, kind, title, slot, detail]) => blocks.push({ id: s + "-" + kind + "-x", s: m(s), e: m(e), kind, title, slot: slot || undefined, detail }));
  }

  blocks.forEach(b => {
    if (b.kind === "surfopt") {
      if (b.slot === surfDay) { b.kind = "surf"; b.title = "Surf (your surf slot this week)"; }
      else { b.kind = "study"; b.title = "Deep work (not your surf slot this week)"; b.task = SWAP[week] || defaultTask("study"); }
    }
    if (TASKED.has(b.kind) && !b.task) b.task = (PLAN[k] && PLAN[k][b.slot]) || defaultTask(b.kind, b.slot);
  });

  const fixedEv = (EVENTS[k] || []).map(([s, e, kind, title], i) => ({ id: "plan" + i, s: m(s), e: m(e), kind, title }));
  const userEv = ds.events.map((x, i) => ({ id: "user" + i, s: m(x.s), e: m(x.e), kind: "event", title: x.title, user: i }));
  // a planned exam in a class slot replaces that class
  fixedEv.forEach(f => { blocks = blocks.filter(b => !(b.kind === "class" && b.s === f.s)); });
  blocks = blocks.filter(b => !ds.skip.includes(b.id));

  const hard = blocks.filter(b => FIXED.has(b.kind) && b.e > b.s).concat(fixedEv, userEv).filter(b => b.e > b.s);

  // ripple forward from a block that now ends later. Gaps and flex blocks absorb the delay,
  // and the ripple stops at the next fixed thing (class, jiu-jitsu, work, exam, bed).
  const ripple = target => {
    let prevEnd = target.e;
    const later = blocks.filter(b => b !== target && b.s >= target.s && !b.gone && !FIXED.has(b.kind) && b.e > b.s)
      .concat(hard.filter(h => h.s >= target.s))
      .sort((a, b) => a.s - b.s);
    for (const b of later) {
      if (hard.includes(b)) break;
      const shift = Math.max(0, prevEnd - b.s);
      if (!shift) break;
      if (b.kind === "flex") {
        const ns = b.s + shift;
        if (ns < b.e) { b.s = ns; break; }
        b.s = b.e; b.gone = true; prevEnd = ns;
      } else { b.s += shift; b.e += shift; prevEnd = b.e; }
    }
  };

  applyTraining(k, dow, blocks, ripple);

  // ran late: extend that block, then ripple forward
  ds.late.forEach(L => {
    const target = blocks.find(b => b.id === L.id);
    if (!target || FIXED.has(target.kind)) return;
    target.e += L.min; target.late = (target.late || 0) + L.min;
    ripple(target);
  });

  // fixed things win: trim flexible blocks around them, keeping the longer part
  blocks.forEach(b => {
    if (FIXED.has(b.kind) || b.gone) return;
    hard.forEach(h => {
      if (h === b) return;
      if (h.s <= b.s && h.e > b.s) b.s = Math.min(h.e, b.e);
      else if (h.s > b.s && h.s < b.e) {
        if (b.e - h.e > h.s - b.s) b.s = h.e; else b.e = h.s;
      }
    });
    if (TASKED.has(b.kind)) { if (b.e - b.s < 15) b.squeezed = true; }
    else if (b.e <= b.s && b.kind !== "bed") b.gone = true;
  });

  let all = blocks.filter(b => !b.gone).concat(fixedEv, userEv);
  all.sort((a, b) => a.s - b.s || (a.e - a.s) - (b.e - b.s));
  all.forEach(b => { b.done = ds.done.includes(b.id); });
  return all;
}

// 12-hour display. hm() stays for 24-hour form inputs.
function clock12(n) { n = ((n % 1440) + 1440) % 1440; const h = Math.floor(n / 60), mi = n % 60; return { t: (h % 12 || 12) + ":" + String(mi).padStart(2, "0"), ap: h < 12 ? "am" : "pm" }; }
const fmt = n => { const c = clock12(n); return c.t + c.ap; };
const fmtH = n => { const c = clock12(n); return c.t + '<small>' + c.ap + "</small>"; };
const fmtStr = s => s ? fmt(m(s)) : "";
const dur = n => n >= 60 ? Math.floor(n / 60) + " h" + (n % 60 ? " " + (n % 60) + " min" : "") : n + " min";

function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function daysTo(k) { const a = parseKey(keyOf(new Date())), b = parseKey(k); return Math.round((b - a) / 864e5); }
const label = b => b.task ? b.task.t : b.title;
// escape, then make Irish phone numbers tappable
const linkify = s => esc(s).replace(/\b(0\d{2}) (\d{3}) (\d{4})\b/g, (x, a, b, c) => `<a href="tel:${a}${b}${c}">${x}</a>`);

/* ---------- undo: snapshot the saved state before anything you might regret ---------- */
let undoSnap = null, undoTimer = null;
function snapshot(msg) {
  undoSnap = { state: JSON.stringify(S), msg };
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoSnap = null; drawToast(); }, 8000);
}
function drawToast() {
  let t = document.getElementById("toast");
  if (!undoSnap) { if (t) t.remove(); return; }
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.innerHTML = `<span>${esc(undoSnap.msg)}</span><button class="btn small" id="undo">Undo</button>`;
  t.querySelector("#undo").onclick = () => { S = JSON.parse(undoSnap.state); save(); undoSnap = null; drawToast(); render(); };
}

function deadlineStrip() {
  const today = keyOf(new Date());
  const list = DEADLINES.filter(x => x.d !== "weekly" && x.d >= today).concat(S.extraDl.filter(x => x.d >= today))
    .sort((a, b) => (a.d + a.t).localeCompare(b.d + b.t)).slice(0, 5);
  return '<div class="dl-strip">' + list.map(x => {
    const n = daysTo(x.d);
    const cls = n <= 2 ? "red" : n <= 7 ? "amber" : "";
    return `<div class="dl-chip ${cls}"><b>${n === 0 ? "Today" : n === 1 ? "Tomorrow" : n + " days"}${x.tbc ? " · tbc" : ""}</b>${esc(x.what.split(".")[0])}</div>`;
  }).join("") + "</div>";
}

function blockHtml(b, curB, openCarry) {
  const zero = b.e === b.s;
  const task = b.task;
  const tag = b.late ? `<span class="tag">+${b.late} min</span>` : b.squeezed ? `<span class="tag">squeezed out</span>` : "";
  let acts = "";
  if (!zero && !NO_DONE.has(b.kind)) {
    acts += `<button class="btn small" data-a="done" data-id="${b.id}">${b.done ? "Undo" : "✓ Done"}</button>`;
    if (!FIXED.has(b.kind)) acts += `<button class="btn small ghost" data-a="late" data-id="${b.id}">Ran late</button>`;
    if (!FIXED.has(b.kind)) acts += `<button class="btn small ghost" data-a="skip" data-id="${b.id}">Can't do it</button>`;
  }
  if (b.squeezed && task) acts = b.done ? `<span class="small muted">On the catch-up list</span>` : `<button class="btn small" data-a="tocarry" data-id="${b.id}">Put on catch-up list</button>`;
  if (b.user !== undefined) acts = `<button class="btn small" data-a="delev" data-i="${b.user}">Remove</button>`;

  const timeTxt = zero ? `<b>${fmtH(b.s)}</b>` : `<b>${fmtH(b.s)}</b><span>to ${fmt(b.e)}</span>`;
  const fixed = FIXED.has(b.kind) && !zero && ["class", "event"].includes(b.kind);

    ${acts ? `<div class="acts">${acts}</div>` : ""}${lateMenu}</div></div>`;

function weekStats(mon) {
  const today = keyOf(new Date());
  const st = { study: 0, studyAll: 0, sport: 0, sportAll: 0, typing: 0, reading: 0, days: 0 };
  const readDays = new Set();
  for (let i = 0; i < 7; i++) {
    const k = addDays(mon, i);
    if (k > today) continue;
    st.days++;
    buildDay(k).forEach(b => {
      if (TASKED.has(b.kind) && !b.squeezed) { st.studyAll++; if (b.done) st.study++; }
      if (SPORT.has(b.kind)) { st.sportAll++; if (b.done) st.sport++; }
      if (b.kind === "typing" && b.done) st.typing++;
      if (b.kind === "bed" && b.e > b.s && b.done) readDays.add(k);
    });
  }
  st.reading = readDays.size;
  return st;
}

function renderWeek() {

/* ---------- find: next session of anything, and how many sessions before each deadline ---------- */
// a topic gathers every way the plan names one module, so "AGP" also finds "Advanced Games Programming"
const TOPICS = [
  { name: "Project 300", words: ["split_shift", "split shift", "project 300", "p300", "streaming", "chunk", "interim"] },
  { name: "AGP", words: ["agp", "advanced games programming", "ca2"] },
  { name: "RAD", words: ["rad", "rad301", "rich app dev"] },
  { name: "Mobile", words: ["mobile", "questlog", "penpot"] },
  { name: "Prof Dev", words: ["prof dev", "interview", "pitch"] },
  { name: "PM exam", words: ["pm mcq", "pm exam", "project mgmt"] },
  { name: "Gym", kinds: ["gym"] },
  { name: "Run", words: ["run:"], kinds: ["cardio"], due: ["half marathon"] },
  { name: "Swim", words: ["swim"], due: ["open-water swim"] },
  { name: "Jiu-jitsu", kinds: ["bjj"] },
  { name: "Surf", kinds: ["surf"] },
  { name: "Tesco", words: ["tesco"] },
];
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const wordRe = words => new RegExp("(^|[^a-z0-9])(" + words.map(reEsc).join("|") + ")(?![a-z0-9])", "i");
TOPICS.forEach(t => { if (t.words) t.re = wordRe(t.words); if (t.due) t.dueRe = wordRe(t.due); });
// which topic a deadline belongs to: its own words, or for sport topics the race/goal words
const dlTopic = x => TOPICS.find(t => (t.dueRe && t.dueRe.test(x.what)) || (t.re && !t.kinds && t.re.test(x.what + " " + (x.where || ""))));
const FIND_DAYS = 56;
// look far enough ahead to count every session before a deadline months away
const horizonFor = dls => Math.max(FIND_DAYS, ...dls.map(x => daysTo(x.d) + 1));
const blockText = b => [b.title, b.task && b.task.t, b.task && b.task.d, b.detail].filter(Boolean).join(" ");
function matcher(q) {
  q = q.trim();
  if (q.length < 2) return null;
  const topic = TOPICS.find(t => t.name.toLowerCase() === q.toLowerCase() || (t.words || []).includes(q.toLowerCase()));
  if (topic) {
    const both = topic.kinds && topic.re; // e.g. Run: a cardio block whose text says run
    return {
      topic,
      block: b => both ? topic.kinds.includes(b.kind) && topic.re.test(blockText(b)) : topic.kinds ? topic.kinds.includes(b.kind) : topic.re.test(blockText(b)),
      text: s => (!!topic.re && topic.re.test(s)) || (!!topic.dueRe && topic.dueRe.test(s)),
    };
  }
  const low = q.toLowerCase();
  return { block: b => blockText(b).toLowerCase().includes(low), text: s => s.toLowerCase().includes(low) };
}
// every block from now on that matches, as [{k, b}] in time order
function upcoming(mt, days) {
  const today = keyOf(new Date()), now = nowMin(), out = [];
  for (let i = 0; i < days; i++) {
    const k = addDays(today, i);
    buildDay(k).forEach(b => {
      if (b.squeezed || b.e === b.s || (i === 0 && b.e <= now)) return;
      if (mt.block(b)) out.push({ k, b });
    });
  }
  return out;
}
const isSession = b => TASKED.has(b.kind) || b.kind === "class" || SPORT.has(b.kind);
// sessions that happen before a deadline (no time given = before that day starts)
function beforeDeadline(hits, x) {
  const cut = x.d + " " + (x.t ? x.t : "00:00");
  const list = hits.filter(h => isSession(h.b) && !h.b.done && h.k + " " + hm(h.b.s) < cut);
  return { list, min: list.reduce((a, h) => a + (h.b.e - h.b.s), 0) };
}
const allDeadlines = () => DEADLINES.filter(x => x.d !== "weekly").concat(S.extraDl)
  .filter(x => x.d >= keyOf(new Date())).sort((a, b) => (a.d + a.t).localeCompare(b.d + b.t));
const whenTxt = (k, b) => { const n = daysTo(k); return (n === 0 ? "Today" : n === 1 ? "Tomorrow" : fmtDay(k)) + " · " + fmt(b.s); };
const dlWhen = x => fmtDay(x.d) + (x.t ? " " + fmtStr(x.t) : "") + " · " + (daysTo(x.d) === 0 ? "today" : daysTo(x.d) + " d");
function frow(h) {
  return `<div class="frow" data-a="open" data-k="${h.k}"><div class="tm">${fmtH(h.b.s)}</div><div class="stripe k-${h.b.kind}"></div>
    <div class="x"><b>${esc(label(h.b))}</b>${h.b.done ? ' <span class="tag">done</span>' : ""}<div class="small muted">${h.b.task ? esc(h.b.title) + " · " : ""}${dur(h.b.e - h.b.s)}</div></div></div>`;
}
function findResults(q) {
  const mt = matcher(q);
  if (!mt) return findOverview();
  const dls = allDeadlines().filter(x => mt.text(x.what + " " + (x.where || "")));
  const all = upcoming(mt, horizonFor(dls));
  const hits = all.filter(x => daysTo(x.k) < FIND_DAYS);
  let h = "";
  const next = hits.find(x => !x.b.done && isSession(x.b)) || hits.find(x => !x.b.done);
  h +=`<div class="card nowcard"><div class="lbl">Next${mt.topic ? " · " + esc(mt.topic.name) : ""}</div>` +
    (next ? `<div class="big">${whenTxt(next.k, next.b)}</div><div>${esc(label(next.b))}</div>
      <div class="acts"><button class="btn small primary" data-a="open" data-k="${next.k}">Open that day</button></div>`
      : `<div class="big">Nothing planned in the next ${FIND_DAYS / 7} weeks</div><div class="small muted">Try a shorter word, or a chip below the search box.</div>`) + `</div>`;
  dls.forEach(x => {
    const r = beforeDeadline(all, x);
    h += `<div class="card"><div class="small muted">Before ${esc(x.what.split(".")[0])} · ${dlWhen(x)}${x.tbc ? " · date to confirm" : ""}</div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px"><span class="big-n">${r.list.length}</span><span>session${r.list.length === 1 ? "" : "s"} left · <b>${dur(r.min)}</b></span></div>
      ${r.list.length ? "" : '<div class="small muted" style="margin-top:4px">None planned. Tell Claude so the plan can make room.</div>'}</div>`;
  });
  if (hits.length) {
    let last = "";
    h += `<div class="card"><h3 class="sec">Coming up · ${hits.length}</h3>` + hits.map(x => {
      const head = x.k !== last ? `<div class="fday">${daysTo(x.k) === 0 ? "Today" : daysTo(x.k) === 1 ? "Tomorrow" : fmtDay(x.k)}</div>` : "";
      last = x.k; return head + frow(x);
    }).join("") + `</div>`;
  }
  return h;
}
// no search yet: one line per module with its next session and the sessions left before its next deadline
function findOverview() {
  const dls = allDeadlines();
  const rows = TOPICS.filter(t => (t.re && !t.kinds) || t.dueRe).map(t => {
    const mt = matcher(t.name);
    const dl = dls.find(x => dlTopic(x) === t);
    const hits = upcoming(mt, dl ? horizonFor([dl]) : FIND_DAYS);
    const next = hits.find(x => !x.b.done && isSession(x.b));
    const r = dl ? beforeDeadline(hits, dl) : null;
    return `<div class="trow" data-a="fq" data-q="${esc(t.name)}"><div><b>${esc(t.name)}</b><div class="small muted">${next ? "Next: " + whenTxt(next.k, next.b) : "Nothing planned"}</div></div>
      <div style="text-align:right">${dl ? `<b>${r.list.length}</b> <span class="small muted">left</span><div class="small muted">before ${fmtDay(dl.d)}</div>` : ""}</div></div>`;
  }).join("");
  return `<div class="card"><h3 class="sec">At a glance</h3><div class="small muted" style="margin-bottom:6px">Sessions left = study blocks and classes planned before that module's next deadline. Tap a row for the full list.</div><div class="tgrid">${rows}</div></div>`;
}
let findQ = "";
function renderFind() {
  const chips = TOPICS.map(t => `<button data-a="fq" data-q="${esc(t.name)}" class="${findQ.toLowerCase() === t.name.toLowerCase() ? "on" : ""}">${esc(t.name)}</button>`).join("");
  return `<div class="card"><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search the plan: AGP, streaming, gym…" value="${esc(findQ)}">
    <div class="chips">${chips}${findQ ? '<button data-a="fq" data-q="">Clear</button>' : ""}</div></div><div id="findres">${findResults(findQ)}</div>`;
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  document.getElementById("findbtn").classList.toggle("on", view === "find");
  app.innerHTML = view === "today" ? renderToday() : view === "find" ? renderFind() : view === "week" ? renderWeek() : view === "deadlines" ? renderDeadlines() : view === "rules" ? renderRules() : view === "shop" ? renderShop() : renderSync();
  const d = new Date();
  document.getElementById("clock").textContent = DAYS[d.getDay()] + " " + fmt(d.getHours() * 60 + d.getMinutes());
  drawToast();
  if (scrollToNow && view === "today") {
    scrollToNow = false;
    const el = app.querySelector(".block.cur");
    if (el) { const y = el.getBoundingClientRect().top + window.pageYOffset - 140; window.scrollTo(0, Math.max(0, y)); }
  }
}

/* ---------- actions ---------- */
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  view = b.dataset.v; openForm = null; render(); window.scrollTo(0, 0);
});
app.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, ds = () => dayState(cur);
  const findBlock = () => buildDay(cur).find(b => b.id === id);
  const toCarry = (b, via) => {
    if (!b || !b.task) return;
    if (S.carry.some(c => !c.done && c.from === cur && c.blockId === b.id)) return;
    S.carry.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), t: b.task.t, d: b.task.d, from: cur, blockId: b.id, via, done: false });
  };
  if (a === "prev") { cur = addDays(cur, -1); showPast = false; }
  else if (a === "next") { cur = addDays(cur, 1); showPast = false; }
  else if (a === "gotoday") { cur = keyOf(new Date()); scrollToNow = true; }
  else if (a === "pweek") cur = addDays(cur, -7);
  else if (a === "nweek") cur = addDays(cur, 7);
  else if (a === "open") { cur = el.dataset.k; view = "today"; showPast = false; window.scrollTo(0, 0); scrollToNow = cur === keyOf(new Date()); }
  else if (a === "past") showPast = !showPast;
  else if (a === "fq") { findQ = el.dataset.q; window.scrollTo(0, 0); }
  else if (a === "findtopic") { e.preventDefault(); findQ = el.dataset.q; view = "find"; window.scrollTo(0, 0); }
  else if (a === "addev") openForm = openForm === "ev" ? null : "ev";
  else if (a === "cancel") openForm = null;
  else if (a === "surf") { S.surf[mondayOf(cur)] = el.dataset.v; save(); }
  else if (a === "reset") {
    snapshot("Day reset");
    delete S.days[cur];
    S.carry = S.carry.filter(c => c.done || c.from !== cur || !c.blockId);
    save();
  }
  else if (a === "done") { const d = ds(); d.done = d.done.includes(id) ? d.done.filter(x => x !== id) : d.done.concat(id); save(); }
  else if (a === "late") openForm = openForm === "late:" + id ? null : "late:" + id;
  else if (a === "lateby") { snapshot("Moved your day back " + el.dataset.n + " min"); ds().late.push({ id, min: +el.dataset.n }); openForm = null; save(); }
  else if (a === "skip" || a === "tocarry") {
    const d = ds();
    if (d.skip.includes(id) || (a === "tocarry" && d.done.includes(id))) return;
    snapshot("Moved to the catch-up list");
    toCarry(findBlock(), a);
    if (a === "skip") d.skip.push(id); else d.done.push(id);
    save();
  }
  else if (a === "stop") {
    const now = nowMin();
    const left = buildDay(cur).filter(b => TASKED.has(b.kind) && !b.done && b.e > now);
    snapshot(left.length ? left.length + " block" + (left.length > 1 ? "s" : "") + " moved to catch-up. Rest up." : "Called it a day");
    left.forEach(b => { toCarry(b, "skip"); ds().skip.push(b.id); });
    save();
  }
  else if (a === "delev") {
    snapshot("Event removed");
    ds().events.splice(+el.dataset.i, 1);
    // blocks that event squeezed out come back, so take their catch-up copies back too
    const back = S.carry.filter(c => !c.done && c.from === cur && c.via === "tocarry").map(c => c.blockId);
    S.carry = S.carry.filter(c => !(back.includes(c.blockId) && c.from === cur && !c.done && c.via === "tocarry"));
    ds().done = ds().done.filter(x => !back.includes(x));
    save();
  }
  else if (a === "cdone" || a === "cdrop") { const c = S.carry.find(x => x.id === id); if (c) { if (a === "cdone") c.done = true; else S.carry = S.carry.filter(x => x !== c); } save(); }
  else if (a === "deldl") { S.extraDl.splice(+el.dataset.i, 1); save(); }
  else if (a === "shopreset") { S.shop = S.shop || {}; delete S.shop[shopKey()]; save(); }
  else if (a === "copy") {
    const t = document.getElementById("code"); t.select();
    try { navigator.clipboard.writeText(t.value).catch(() => document.execCommand("copy")); } catch (x) { document.execCommand("copy"); }
    el.textContent = "Copied"; return;
  }
  else if (a === "load") {
    try { const v = JSON.parse(decodeURIComponent(escape(atob(document.getElementById("paste").value.trim())))); S = Object.assign({ days: {}, carry: [], surf: {}, extraDl: [], notes: {} }, v); save(); alert("Loaded."); }
    catch (x) { alert("That code didn't work. Copy it again from the other device."); return; }
  }
  render();
});
// tick boxes: night-before checklist and the Tesco list
app.addEventListener("change", e => {
  const t = e.target;
  if (!t.dataset || (!t.dataset.prep && !t.dataset.shop)) return;
  const bucket = t.dataset.prep ? "prep" : "shop";
  const key = t.dataset.prep || t.dataset.shop;
  S[bucket] = S[bucket] || {};
  const list = S[bucket][key] || [];
  S[bucket][key] = t.checked ? list.concat(t.dataset.item) : list.filter(x => x !== t.dataset.item);
  save(); render();
});
document.getElementById("findbtn").addEventListener("click", () => {
  view = "find"; openForm = null; render(); window.scrollTo(0, 0);
  if (!findQ) { const q = document.getElementById("q"); if (q) q.focus(); }
});
app.addEventListener("input", e => {
  // only the results redraw while typing, so the search box keeps focus and the keyboard stays up
  if (e.target.id === "q") { findQ = e.target.value; document.getElementById("findres").innerHTML = findResults(findQ); return; }
  if (e.target.id === "note") { S.notes = S.notes || {}; const v = e.target.value; if (v) S.notes[cur] = v; else delete S.notes[cur]; save(); }
});
app.addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "evf") {
    const s = f.get("s"), en = f.get("e");
    if (m(en) <= m(s)) { alert("The end time needs to be after the start."); return; }
    dayState(cur).events.push({ title: f.get("title"), s, e: en }); openForm = null;
  } else if (e.target.id === "dlf") {
    S.extraDl.push({ d: f.get("d"), t: f.get("t") || "", what: f.get("what"), where: "", tbc: false });
  }
  save(); render();
});
let lastSeenToday = keyOf(new Date());
// follow the date over midnight if you were looking at "today"
function rollDate() {
  const t = keyOf(new Date());
  if (t === lastSeenToday) return false;
  if (cur === lastSeenToday) { cur = t; openForm = null; showPast = false; scrollToNow = true; }
  lastSeenToday = t;
  return true;
}
function tick() {
  const d = new Date();
  document.getElementById("clock").textContent = DAYS[d.getDay()] + " " + fmt(d.getHours() * 60 + d.getMinutes());
  const rolled = rollDate();
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (view === "today" && (rolled || (!openForm && !typing))) render();
}
render();
setInterval(tick, 60000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (rollDate() || view === "today") { scrollToNow = view === "today"; if (!openForm) render(); else tick(); }
});
</script>
